name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install native build dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libflac-dev pkg-config

      - name: Install aarch64 cross-compile dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libasound2-dev:arm64 \
            libdbus-1-dev:arm64 \
            libflac-dev:arm64 \
            pkg-config

      - name: Build release binaries (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Build release binaries (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.2.0}"
          PKG_DIR="djm-rec-linux-${TAG_NAME}-${{ matrix.arch }}"
          mkdir -p "$PKG_DIR/bin"
          
          cp "target/${{ matrix.target }}/release/djm-box" "$PKG_DIR/bin/"
          cp "target/${{ matrix.target }}/release/djm-daemon" "$PKG_DIR/bin/"
          cp "target/${{ matrix.target }}/release/djm-tui" "$PKG_DIR/bin/"
          cp "target/${{ matrix.target }}/release/djm-remote" "$PKG_DIR/bin/"
          cp README.md LICENSE "$PKG_DIR/"
          
          TARBALL="${PKG_DIR}.tar.gz"
          tar -czvf "$TARBALL" "$PKG_DIR"
          sha256sum "$TARBALL" > "${TARBALL}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            djm-rec-linux-*.tar.gz
            djm-rec-linux-*.tar.gz.sha256

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            djm-rec-linux-*.tar.gz
            djm-rec-linux-*.tar.gz.sha256
          generate_release_notes: true
