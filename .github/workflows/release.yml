name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libflac-dev pkg-config

      - name: Symlink libflac.so for flac-sys
        run: |
          for dir in /usr/lib /usr/lib/*-linux-gnu* /usr/lib64 /usr/local/lib; do
            if [ -f "$dir/libFLAC.so" ] && [ ! -f "$dir/libflac.so" ]; then
              sudo ln -sf "$dir/libFLAC.so" "$dir/libflac.so" || true
            fi
          done

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.2.0}"
          PKG_DIR="djm-rec-linux-${TAG_NAME}-${{ matrix.arch }}"
          mkdir -p "$PKG_DIR/bin"
          
          cp "target/${{ matrix.target }}/release/djm-box" "$PKG_DIR/bin/"
          cp "target/${{ matrix.target }}/release/djm-daemon" "$PKG_DIR/bin/"
          cp "target/${{ matrix.target }}/release/djm-tui" "$PKG_DIR/bin/"
          cp "target/${{ matrix.target }}/release/djm-remote" "$PKG_DIR/bin/"
          cp README.md LICENSE "$PKG_DIR/"
          
          TARBALL="${PKG_DIR}.tar.gz"
          tar -czvf "$TARBALL" "$PKG_DIR"
          sha256sum "$TARBALL" > "${TARBALL}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            djm-rec-linux-*.tar.gz
            djm-rec-linux-*.tar.gz.sha256

  android:
    name: Build Android Companion APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter project & run tests
        working-directory: flutter_app
        run: |
          rm -rf android
          flutter create --platforms=android --org com.craterdnb --project-name djm_companion .
          rm -f test/widget_test.dart
          python3 -c '
          import os
          manifest = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest):
              with open(manifest, "r") as f:
                  content = f.read()
              if "android.permission.BLUETOOTH_SCAN" not in content:
                  permissions = """
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-feature android:name="android.hardware.camera" android:required="false" />
    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
"""
                  content = content.replace("<application", permissions + "\n    <application")
                  with open(manifest, "w") as f:
                      f.write(content)
          '
          flutter pub get
          flutter test

      - name: Build Release APK
        working-directory: flutter_app
        run: |
          flutter build apk --release
          TAG_NAME="${GITHUB_REF_NAME:-v0.2.1}"
          APK_NAME="djm-box-companion-${TAG_NAME}.apk"
          APK_PATH=$(find build -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in build directory!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" "../${APK_NAME}"
          cd ..
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            djm-box-companion-*.apk
            djm-box-companion-*.apk.sha256

  release:
    name: Publish Release
    needs: [build, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets/

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
