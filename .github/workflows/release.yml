name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libflac-dev pkg-config

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.2.0}"
          PKG_DIR="djm-rec-linux-${TAG_NAME}-${{ matrix.arch }}"
          mkdir -p "$PKG_DIR/bin"
          
          cp "target/${{ matrix.target }}/release/djm-box" "$PKG_DIR/bin/"
          cp "target/${{ matrix.target }}/release/djm-daemon" "$PKG_DIR/bin/"
          cp "target/${{ matrix.target }}/release/djm-tui" "$PKG_DIR/bin/"
          cp "target/${{ matrix.target }}/release/djm-remote" "$PKG_DIR/bin/"
          cp README.md LICENSE "$PKG_DIR/"
          
          TARBALL="${PKG_DIR}.tar.gz"
          tar -czvf "$TARBALL" "$PKG_DIR"
          sha256sum "$TARBALL" > "${TARBALL}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            djm-rec-linux-*.tar.gz
            djm-rec-linux-*.tar.gz.sha256

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets/

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
